# ════════════════════════════════════════════════════════════════
#  Friomac CRM — Docker Compose (PRODUÇÃO)
#  Override para dev: docker-compose.dev.yml
# ════════════════════════════════════════════════════════════════

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend-net]
    depends_on:
      - frontend
      - backend
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - CF_API_TOKEN=${CF_API_TOKEN:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: friomac/crm-frontend:${TAG:-latest}
    restart: unless-stopped
    expose: ["80"]
    networks: [frontend-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: friomac/crm-backend:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    expose: ["8000"]
    networks: [frontend-net, backend-net]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: friomac/crm-backend:${TAG:-latest}
    restart: unless-stopped
    command: ["arq", "app.workers.arq_worker.WorkerSettings"]
    env_file: .env
    networks: [backend-net]
    depends_on:
      backend: { condition: service_healthy }
      redis: { condition: service_healthy }

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    networks: [backend-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-friomac}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [backend-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-friomac}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_minio}
    volumes:
      - minio_data:/data
    networks: [backend-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  pg-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_backups:/backups
      - ./infra/backup/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
    entrypoint: ["sh", "-c", "while true; do /usr/local/bin/pg-backup.sh; sleep 86400; done"]
    networks: [backend-net]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pg_data:
  redis_data:
  minio_data:
  pg_backups:
  caddy_data:
  caddy_config:

networks:
  frontend-net:
  backend-net:

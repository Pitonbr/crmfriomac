[project]
name = "friomac-crm-backend"
version = "0.1.0"
description = "Friomac CRM backend (FastAPI + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Friomac Indústria" }]

dependencies = [
    # Web
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "gunicorn>=23.0",
    "python-multipart>=0.0.20",

    # DB / ORM
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30",
    "alembic>=1.14",

    # Config / validation
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",

    # Security
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",

    # Observability
    "structlog>=24.4",

    # HTTP client (integrações)
    "httpx>=0.28",

    # Storage
    "boto3>=1.35",
    "minio>=7.2",

    # Cache / WS pubsub / jobs
    "redis>=5.2",
    "arq>=0.26",

    # Admin
    "sqladmin>=0.20",
    "itsdangerous>=2.2",          # dep do SessionMiddleware usado pelo SQLAdmin

    # Rate limit
    "slowapi>=0.1.9",

    # Templates (email)
    "jinja2>=3.1",

    # Machine Learning — probabilidade de fechamento e previsão de receita
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis>=4.6",
    "types-passlib",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*", "scripts*"]

# ── Ruff ────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "ASYNC", # async best practices
    "S",     # bandit (security)
    "C4",    # comprehensions
    "RUF",   # ruff-specific
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "S101",  # assert usado em testes
    "B008",  # FastAPI Depends() em defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B011"]
"scripts/**/*.py" = ["S"]

# ── Mypy ────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/", "tests/"]

[[tool.mypy.overrides]]
module = ["minio.*", "arq.*", "sqladmin.*", "slowapi.*"]
ignore_missing_imports = true

# ── Pytest ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: testes que tocam DB/Redis/MinIO",
    "slow: testes lentos (e2e)",
]

# ── Coverage ────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "app/workers/arq_worker.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

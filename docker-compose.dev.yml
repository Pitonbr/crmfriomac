# ════════════════════════════════════════════════════════════════
#  Override para DESENVOLVIMENTO
#  Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ════════════════════════════════════════════════════════════════

services:
  # Caddy não é estritamente necessário em dev (proxy do Vite cuida)
  # mas mantemos para testar config; expõe direto o frontend dev na 5173.
  caddy:
    profiles: ["proxy"]   # só sobe se: docker compose --profile proxy up

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: friomac/crm-frontend:dev
    command: ["pnpm", "dev", "--host", "0.0.0.0"]
    ports:
      # 5174 no host para evitar conflito com outro Vite local
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules        # anonymous volume preserva node_modules do container
    environment:
      # Vazios = fetch relativo (same-origin via Vite proxy → backend interno)
      # Evita CORS e cross-site cookie em dev. Em prod, Caddy faz mesmo papel.
      - VITE_API_BASE_URL=
      - VITE_WS_URL=
      - VITE_BACKEND_INTERNAL_URL=http://backend:8000
    depends_on: []                # em dev não dependemos do backend para subir o front

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      # 8001 no host para evitar conflito com serviço local na 8000
      - "8001:8000"
    volumes:
      - ./backend:/app
      - ./scripts:/app/scripts                # python -m scripts.seed_from_legacy
      - ./legacy:/app/legacy:ro               # fonte do seed
    environment:
      - APP_ENV=dev
      - LOG_LEVEL=debug
      - COOKIE_SECURE=false
      - COOKIE_DOMAIN=localhost

  db:
    ports:
      # 5433 no host (evita conflito com Postgres local). Internamente continua 5432.
      - "5433:5432"

  redis:
    # Sem porta exposta — acesso via `docker compose exec redis redis-cli`
    # Evita conflito com Redis local em 6379
    ports: []

  minio:
    # Portas remapeadas para evitar conflitos comuns com outros serviços
    # API S3: localhost:9100 (interno continua 9000) — backend usa nome interno
    # Console: localhost:9101
    ports:
      - "9100:9000"
      - "9101:9001"

  worker:
    # Sprint 5 ativo: arq workers rodando jobs assíncronos (SLA, etc)
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    image: friomac/crm-backend:latest
    command: ["arq", "app.workers.arq_worker.WorkerSettings", "--watch", "/app"]
    volumes:
      - ./backend:/app
      - ./scripts:/app/scripts
    environment:
      - APP_ENV=dev
      - LOG_LEVEL=info

  pg-backup:
    profiles: ["backup"]          # só sobe quando explicitamente pedido

# ════════════════════════════════════════════════════════════════
#  Override para DESENVOLVIMENTO
#  Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ════════════════════════════════════════════════════════════════

services:
  # Caddy não é estritamente necessário em dev (proxy do Vite cuida)
  # mas mantemos para testar config; expõe direto o frontend dev na 5173.
  caddy:
    profiles: ["proxy"]   # só sobe se: docker compose --profile proxy up

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: friomac/crm-frontend:dev
    command: ["pnpm", "dev", "--host", "0.0.0.0"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules        # anonymous volume preserva node_modules do container
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    depends_on: []                # em dev não dependemos do backend para subir o front

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./scripts:/scripts
    environment:
      - APP_ENV=dev
      - LOG_LEVEL=debug
      - COOKIE_SECURE=false
      - COOKIE_DOMAIN=localhost

  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  worker:
    command: ["arq", "app.workers.arq_worker.WorkerSettings", "--watch", "/app"]
    volumes:
      - ./backend:/app

  pg-backup:
    profiles: ["backup"]          # só sobe quando explicitamente pedido
